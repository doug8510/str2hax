name: Build str2hax USA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar index.html para USA
        run: |
          sudo apt-get update && sudo apt-get install -y gcc libgmp-dev zip
          sed -i 's/EUR/USA/g; s/JAP/USA/g; s/KOR/USA/g' chain_builder.c
          gcc chain_builder.c -lgmp -O2 -o chain_builder
          ./chain_builder > chain.txt || ./chain_builder
          ls -la
      - name: Salvar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: str2hax-USA
          path: |
            index.html
            chain*
